[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cado-ai-api"
version = "0.1.0"
description = "FastAPI backend for Cado AI"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14",
  "argon2-cffi>=23.1",
  "asyncpg>=0.30",
  "email-validator>=2.2",
  "fastapi>=0.115",
  "httpx>=0.28",
  "openai>=1.68",
  "pgvector>=0.3",
  "pydantic-settings>=2.8",
  "pyjwt>=2.10",
  "pymupdf>=1.25",
  "python-multipart>=0.0.20",
  "slowapi>=0.1.9",
  "sqlalchemy[asyncio]>=2.0",
  "structlog>=25.1",
  "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.4"]
ocr = ["pytesseract>=0.3.13", "pillow>=11.1"]
dev = ["aiosqlite>=0.21", "pytest>=8.3", "pytest-asyncio>=0.25", "ruff>=0.9"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*", "tests*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]
